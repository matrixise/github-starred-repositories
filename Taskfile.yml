# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

dotenv: ['.env']

vars:
  CONCURRENCY: '10'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  sync:
    desc: Sync starred repositories from GitHub (incremental)
    cmds:
      - uv run starred sync

  sync:full:
    desc: Full sync — reload all starred repositories from scratch
    cmds:
      - uv run starred sync --full

  refresh-stars:
    desc: "Refresh stars, archived flag and dates (usage: task refresh-stars [BATCH_SIZE=100])"
    cmds:
      - uv run starred refresh-stars {{if .BATCH_SIZE}}--batch-size {{.BATCH_SIZE}}{{end}}

  fetch-readme:
    desc: "Fetch README files (usage: task fetch-readme [LIMIT=50] [CONCURRENCY=10])"
    cmds:
      - uv run starred fetch-readme {{if .LIMIT}}--limit {{.LIMIT}}{{end}} --concurrency {{.CONCURRENCY}}

  analyze:
    desc: "Analyze repositories with Claude (usage: task analyze [LIMIT=20] [ANALYZE_CONCURRENCY=3])"
    vars:
      LIMIT: '{{.LIMIT | default "20"}}'
      ANALYZE_CONCURRENCY: '{{.ANALYZE_CONCURRENCY | default "3"}}'
    cmds:
      - uv run starred analyze --limit {{.LIMIT}} --concurrency {{.ANALYZE_CONCURRENCY}}

  digest:
    desc: "Summarize recently starred repos (usage: task digest [SINCE=24h])"
    vars:
      SINCE: '{{.SINCE | default "24h"}}'
    cmds:
      - uv run starred digest --since {{.SINCE}}

  search:
    desc: "Search the catalogue by keyword (usage: task search -- ngrok tunnel)"
    cmds:
      - uv run starred search {{.CLI_ARGS}}

  export:
    desc: Export high-scoring repositories to Obsidian vault (reads OBSIDIAN_* from .env)
    cmds:
      - uv run starred export-obsidian --vault "$OBSIDIAN_VAULT" --min-score "$OBSIDIAN_MIN_SCORE" --tag "$OBSIDIAN_TAG"

  export:prune:
    desc: Export to Obsidian and remove orphan notes
    cmds:
      - uv run starred export-obsidian --vault "$OBSIDIAN_VAULT" --min-score "$OBSIDIAN_MIN_SCORE" --tag "$OBSIDIAN_TAG" --prune

  secrets:
    desc: Scan git history for leaked secrets with gitleaks
    cmds:
      - gitleaks git --verbose

  update:
    desc: Full pipeline — sync, fetch READMEs, analyze, export to Obsidian
    cmds:
      - task: sync
      - task: fetch-readme
      - task: analyze
      - task: export
